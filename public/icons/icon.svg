<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the icon also works as "maskable" -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Back card -->
  <rect x="150" y="128" width="200" height="260" rx="28" fill="#ffffff" fill-opacity="0.35" transform="rotate(-12 250 258)"/>
  <!-- Front card -->
  <rect x="166" y="126" width="200" height="260" rx="28" fill="#ffffff" transform="rotate(8 266 256)"/>
  <!-- "Aa" on the front card -->
  <text x="266" y="290" text-anchor="middle" transform="rotate(8 266 256)"
        font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="104" fill="#4338ca">Aa</text>
</svg>
